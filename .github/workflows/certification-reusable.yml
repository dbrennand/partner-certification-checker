---
# Ansible collection certification reusable workflow.
# Contains pinned versions of tests for certified
# collections on Automation Hub.
# This workflow is managed by Red Hat and can be
# called by certification.yml or another workflow.
name: "Run versioned collection certification checks"

permissions:
  contents: read

env:
  GALAXY_IMPORTER_VER: "0.4.39"
  ANSIBLE_LINT_VER: "26.4.0"
  ANTSIBULL_NOX_VER: "1.10.0"
  NOX_VER: "2026.10.20"

on:
  workflow_call:
    inputs:
      ansible-core-version:
        description: >-
          ansible-core version to use for build-import and lint jobs
          (e.g. 2.16.19). To control which ansible-core versions are
          used for sanity tests, see the skip-sanity-versions input.
        required: false
        default: "2.16.19"
        type: string
      origin-python-version:
        description: >-
          Python version for the build-import and lint jobs
          (e.g. "3.12"). Downstream Execution Environments use Python 3.12.
          It is not recommended to change this input. Sanity testing always
          uses Python 3.12 for the runner and container controller.
        required: false
        default: "3.12"
        type: string
      collection-root:
        description: >-
          Relative path to the collection root in the repository.
          This input should only be used when the collection is
          in a non standard location (not at the root of the
          repository).
        default: "."
        type: string
      collection-deps:
        description: >-
          Specify additional collection dependencies to install during sanity checks.
          Dependencies from galaxy.yml are installed automatically by antsibull-nox.
          Other requirements.yml files are not automatically loaded.
          You can specify multiple collections separated
          with spaces; for example, "kubernetes.core amazon.aws".
        default: ""
        type: string
      automation-hub:
        type: boolean
        description: >-
          Configure Red Hat Ansible Automation Hub as a Galaxy server
          for ansible-galaxy to use when installing collections.
          The 'AH_TOKEN' secret must be provided when using this input.
        default: false
      skip-sanity-versions:
        description: >-
          Space-separated list of ansible-core stable branches to
          skip in sanity tests (e.g. "stable-2.16" or
          "stable-2.16 stable-2.18"). When empty, the workflow
          auto-detects the minimum version from requires_ansible
          in meta/runtime.yml and filters the matrix accordingly.
          Set this input to override auto-detection.
        required: false
        default: ""
        type: string
    secrets:
      AH_TOKEN:
        description: >-
          Token used to authenticate with Red Hat Ansible Automation Hub.
          Use the 'AH_TOKEN' secret when the automation-hub input boolean is true.
        required: false

jobs:
  # Build the collection and run galaxy-importer on it
  # skipping ansible-lint as it runs as a separate job
  build-import:
    name: "Build & import collection"
    env:
      CHECK_REQUIRED_TAGS: "True"
      RUN_ANSIBLE_LINT: "False"
      CORE_VER: ${{ inputs.ansible-core-version }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.origin-python-version }}

      - name: Install ansible-core
        run: pip install ansible-core=="${CORE_VER}"

      - name: Install distlib required by ansible-galaxy build
        run: pip install "distlib>=0.3.9"

      - name: Install galaxy-importer
        shell: bash
        run: pip install galaxy-importer=="${GALAXY_IMPORTER_VER}"

      - name: Update galaxy-importer.cfg
        shell: bash
        run: |
          cat > /tmp/galaxy-importer.cfg << EOF
          [galaxy-importer]
          CHECK_REQUIRED_TAGS=${{ env.CHECK_REQUIRED_TAGS }}
          RUN_ANSIBLE_LINT=${{ env.RUN_ANSIBLE_LINT }}
          EOF

          echo "GALAXY_IMPORTER_CONFIG=/tmp/galaxy-importer.cfg" >> "${GITHUB_ENV}"

      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Build the collection tarball and run galaxy importer on it
        shell: bash
        run: python -m galaxy_importer.main --git-clone-path "${COLLECTION_ROOT}" --output-path /tmp

  # Run ansible-lint with profile "production"
  lint:
    name: "Lint production"
    runs-on: ubuntu-latest
    env:
      CORE_VER: ${{ inputs.ansible-core-version }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.origin-python-version }}

      - name: Install ansible-lint and ansible-core
        run: pip install ansible-lint=="${ANSIBLE_LINT_VER}" ansible-core=="${CORE_VER}"

      - name: Install distlib required by ansible-galaxy build
        run: pip install "distlib>=0.3.9"

      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Run ansible-lint
        # We must change directory first prior to running ansible-lint
        # if a collection root other than the default has been provided.
        # If we do not, ansible-lint does not install the collection itself.
        # Using --project-dir or passing the relative path to the collection
        # as the positional argument do not work.
        run: |
          if [ "${COLLECTION_ROOT}" != "." ]; then
            echo "Changing directory based on collection root ${COLLECTION_ROOT}"
            cd "${COLLECTION_ROOT}"
          fi
          ansible-lint --profile=production

  # Compute the sanity matrix by auto-detecting the minimum
  # ansible-core version from meta/runtime.yml or by using the
  # explicit skip-sanity-versions input as an override.
  compute-sanity-matrix:
    name: "Compute sanity matrix"
    runs-on: ubuntu-latest
    env:
      # Ansible Core versions aligned with Downstream Execution Environments.
      ALL_SANITY_VERSIONS: "stable-2.16 stable-2.18 stable-2.20"
      SKIP_VERSIONS: ${{ inputs.skip-sanity-versions }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        if: ${{ inputs.skip-sanity-versions == '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.collection-root == '.' && 'meta/runtime.yml' ||
            format('{0}/meta/runtime.yml', inputs.collection-root) }}
          sparse-checkout-cone-mode: false

      - name: Filter sanity versions
        id: filter
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          all_versions = os.environ["ALL_SANITY_VERSIONS"].split()
          skip = set(os.environ.get("SKIP_VERSIONS", "").split())

          if skip:
              filtered = [v for v in all_versions if v not in skip]
          else:
              filtered = all_versions
              runtime_path = Path(os.environ.get("COLLECTION_ROOT", ".")) / "meta" / "runtime.yml"
              if runtime_path.is_file():
                  match = re.search(
                      r"requires_ansible:\s*[\"']?>=?\s*(\d+)\.(\d+)",
                      runtime_path.read_text(),
                  )
                  if match:
                      min_minor = int(match.group(2))
                      filtered = [
                          v for v in all_versions
                          if (m := re.search(r"\.(\d+)", v)) and int(m.group(1)) >= min_minor
                      ]
                      print(f"Auto-detected requires_ansible >= {match.group(1)}.{match.group(2)}")

          if not filtered:
              print("::error::All sanity versions were filtered out. At least one version must remain.")
              raise SystemExit(1)

          matrix = json.dumps([{"ansible": v} for v in filtered])
          print(f"Sanity matrix: {matrix}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          output_path.write_text(output_path.read_text() + f"matrix={matrix}\n")

  # Run sanity checks against the collection
  sanity:
    needs: compute-sanity-matrix
    name: Sanity (Ⓐ${{ matrix.ansible }}) (controller Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.compute-sanity-matrix.outputs.matrix) }}

    env:
      SANITY_BRANCH: ${{ matrix.ansible }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
      COLLECTION_DEPS: ${{ inputs.collection-deps }}
      ANTSIBULL_NOX_IGNORE_INSTALLED_COLLECTIONS: "true"
      ANSIBLE_TEST_PREFER_PODMAN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up sanity runner Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Nox and antsibull-nox
        run: python -m pip install "nox==${NOX_VER}" "antsibull-nox==${ANTSIBULL_NOX_VER}"

      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # Keep the driver outside the collection and independent of partner Nox config.
      # Embedding it ties its version to the reusable workflow, including fork tests.
      - name: Write sanity noxfile
        id: sanity-driver
        shell: bash
        run: |
          report_id="$(python -c 'import uuid; print(uuid.uuid4())')"
          echo "report-id=${report_id}" >> "${GITHUB_OUTPUT}"
          cat > "${RUNNER_TEMP}/certification-noxfile.py" <<'PY'
          import os
          import shutil
          from pathlib import Path

          import nox
          from antsibull_nox.sessions import prepare_collections


          @nox.session(python="3.12")
          def certification_sanity(session):
              branch = os.environ["SANITY_BRANCH"]
              collection_root = (
                  Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["COLLECTION_ROOT"]
              ).resolve()
              results = Path(os.environ["RUNNER_TEMP"]) / "certification-sanity-results"
              session.install(f"https://github.com/ansible/ansible/archive/{branch}.tar.gz")
              with session.chdir(collection_root):
                  prepared = prepare_collections(
                      session,
                      ansible_core_version=branch.removeprefix("stable-"),
                      install_in_site_packages=False,
                      install_out_of_tree=True,
                      extra_collections=os.environ["COLLECTION_DEPS"].split(),
                  )
              if prepared is None:
                  session.error("Collection preparation failed")
              try:
                  with session.chdir(prepared.current_path):
                      session.run(
                          "ansible-test", "sanity",
                          "--controller", "docker:default,python=3.12",
                          "--junit", "-v", "--color", "yes",
                      )
              finally:
                  output = prepared.current_path / "tests" / "output"
                  if output.is_dir():
                      shutil.copytree(output, results, dirs_exist_ok=True)
          PY

      - name: Perform sanity testing
        run: >-
          nox --noxfile "${RUNNER_TEMP}/certification-noxfile.py"
          --envdir "${RUNNER_TEMP}/certification-nox"
          --session certification_sanity

      - name: Upload sanity results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanity-${{ matrix.ansible }}-${{ steps.sanity-driver.outputs.report-id }}
          path: ${{ runner.temp }}/certification-sanity-results/
          if-no-files-found: ignore
